# ======================================
# Pune Mumbai Cab - Application Properties
# ======================================
# All sensitive values read from environment variables.

# ---- Server ----
server.port=${SERVER_PORT:8080}

# ---- MySQL Datasource ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pune_mumbai_cab?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=root
spring.datasource.password=system
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ---- SQL Init (disabled by default) ----
# spring.sql.init.mode=always
# spring.sql.init.schema-locations=classpath:schema.sql

# ---- JWT ----
jwt.secret=${JWT_SECRET:change-me-to-a-long-random-string-in-production}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- CORS ----
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ---- Logging ----
logging.level.com.punemumbai.cab=INFO
logging.level.org.springframework.security=WARN
